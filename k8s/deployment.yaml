apiVersion: apps/v1
kind: Deployment
metadata:
  name: container-lab
  labels:
    app: container-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: container-lab
  template:
    metadata:
      labels:
        app: container-lab
    spec:
      containers:
        - name: web
          image: container-lab:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
